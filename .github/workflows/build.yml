name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: pip install -r requirements.txt pyinstaller
      - name: inno
        run: choco install innosetup -y --no-progress
      - name: build
        run: powershell -ExecutionPolicy Bypass -File packaging/build_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/installer/*.exe
            dist/NardoFoxWriteDesk/**

  linux-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1
          pip install -r requirements.txt pyinstaller
      - name: build deb
        run: bash packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*.deb

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1
          pip install -r requirements.txt pyinstaller
      - name: build deb
        run: bash packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/*.deb

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: pip install -r requirements.txt pyinstaller
      - name: build dmg
        run: bash packaging/mac/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  macos-x64:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: pip install -r requirements.txt pyinstaller
      - name: build dmg
        run: bash packaging/mac/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: [windows, linux-amd64, linux-arm64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
